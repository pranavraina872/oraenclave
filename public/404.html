<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>404 — Orca Enclave</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Inter", sans-serif;
        background: #1A1A1A;
        color: #FAF8F5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .font-display { font-family: "Playfair Display", serif; }
      .bg-glow {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }
      .oval-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(255, 128, 176, 0.1);
        pointer-events: none;
        animation: spin 20s linear infinite;
      }
      .oval-ring-reverse {
        animation-direction: reverse;
        animation-duration: 25s;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade { animation: fadeUp 0.8s ease-out both; }
      .delay-1 { animation-delay: 0.2s; }
      .delay-2 { animation-delay: 0.5s; }
      .delay-3 { animation-delay: 0.8s; }
      .delay-4 { animation-delay: 1.1s; }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #FF80B0;
        text-decoration: none;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        transition: all 0.3s;
      }
      a:hover { color: #fff; gap: 14px; }
    </style>
  </head>
  <body>
    <div class="bg-glow" style="width:60vmin;height:60vmin;background:rgba(255,128,176,0.06);blur(120px);top:5%;left:-10%;filter:blur(120px)"></div>
    <div class="bg-glow" style="width:40vmin;height:40vmin;background:rgba(194,24,91,0.08);blur(100px);bottom:0;right:5%;filter:blur(100px)"></div>
    <div class="oval-ring" style="width:80vmin;height:30vmin;top:50%;left:50%;transform:translate(-50%,-50%)"></div>
    <div class="oval-ring oval-ring-reverse" style="width:60vmin;height:22vmin;top:50%;left:50%;transform:translate(-50%,-50%)"></div>
    <div style="position:relative;z-index:10;text-align:center;padding:0 24px">
      <div class="animate-fade delay-1">
        <svg width="48" height="48" viewBox="0 0 40 40" fill="none" style="margin:0 auto 32px;color:#FF80B0">
          <path d="M6.555 9.124C4.817 7.386 4.69 4.694 4.69 4.694s2.692.127 4.43 1.865c1.738 1.739 1.865 4.43 1.865 4.43s-2.691-.127-4.43-1.865z" fill="currentColor" />
          <path d="M20 .002l-3.843 8.117a5.143 5.143 0 000 3.762l2.342 4.948a3.2 3.2 0 00-1.645 1.68l-4.973-2.353a5.143 5.143 0 00-3.762 0L0 20v-.823c0-.828.423-1.598 1.122-2.041l6.522-4.14a5.143 5.143 0 014.712 0l1.75 1.11-1.11-1.75a5.143 5.143 0 010-4.712l4.14-6.522C17.58.423 18.35 0 19.178 0L20 .002z" fill="currentColor" />
          <path d="M33.445 30.876c1.738 1.738 1.865 4.43 1.865 4.43s-2.692-.127-4.43-1.865c-1.738-1.739-1.865-4.43-1.865-4.43s2.691.127 4.43 1.865z" fill="currentColor" />
          <path d="M20 39.998l3.843-8.117a5.143 5.143 0 000-3.762l-2.342-4.948a3.2 3.2 0 001.645-1.68l4.973 2.353a5.143 5.143 0 003.762 0L40 20v.823c0 .828-.423 1.598-1.122 2.041l-6.522 4.14a5.143 5.143 0 01-4.712 0l-1.75-1.11 1.11 1.75a5.143 5.143 0 010 4.712l-4.14 6.522c-.444.699-1.214 1.122-2.041 1.122L20 39.998z" fill="currentColor" />
          <path d="M30.876 6.555c1.738-1.738 4.43-1.865 4.43-1.865s-.127 2.692-1.865 4.43c-1.739 1.738-4.43 1.865-4.43 1.865s.127-2.691 1.865-4.43z" fill="currentColor" />
          <path d="M39.999 20l-8.118-3.843a5.143 5.143 0 00-3.762 0l-4.948 2.342a3.2 3.2 0 00-1.68-1.645l2.353-4.973a5.143 5.143 0 000-3.762L20 0h.823c.828 0 1.598.423 2.041 1.122l4.14 6.522a5.143 5.143 0 010 4.712l-1.11 1.75 1.75-1.11a5.143 5.143 0 014.712 0l6.522 4.14c.699.444 1.122 1.214 1.122 2.041l-.001.823z" fill="currentColor" />
          <path d="M9.124 33.445c-1.738 1.738-4.43 1.865-4.43 1.865s.127-2.692 1.865-4.43c1.739-1.738 4.43-1.865 4.43-1.865s-.127 2.691-1.865 4.43z" fill="currentColor" />
          <path d="M0 20l8.118 3.843a5.143 5.143 0 003.762 0l4.948-2.342a3.2 3.2 0 001.68 1.645l-2.353 4.973a5.143 5.143 0 000 3.762L20 40h-.823c-.828 0-1.598-.423-2.041-1.122l-4.14-6.522a5.143 5.143 0 010-4.712l1.11-1.75-1.75 1.11a5.143 5.143 0 01-4.712 0L1.122 22.864C.423 22.42 0 21.65 0 20.822L0 20z" fill="currentColor" />
        </svg>
      </div>
      <h1 class="font-display" style="font-size:clamp(80px,20vw,140px);font-weight:700;line-height:1;margin-bottom:8px;background:linear-gradient(135deg,#FF80B0,#C2185B,#FF80B0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">404</h1>
      <div class="animate-fade delay-2">
        <p style="font-size:14px;color:rgba(255,255,255,0.5);letter-spacing:0.05em;max-width:360px;margin:0 auto 40px;line-height:1.7">
          The page you are looking for has drifted out to sea.
        </p>
      </div>
      <div class="animate-fade delay-3">
        <a href="/">Back to shore</a>
      </div>
    </div>
    <script>
      (function() {
        var r = document.querySelector('.oval-ring');
        var s = r.style;
        var x = 50, y = 50, dx = 0.15, dy = 0.1;
        setInterval(function() {
          x += dx; y += dy;
          if (x > 55 || x < 45) dx = -dx;
          if (y > 55 || y < 45) dy = -dy;
          s.left = x + '%';
          s.top = y + '%';
          s.transform = 'translate(-50%,-50%)';
        }, 50);
      })();
    </script>
  </body>
</html>
